<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Token Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Cloud Token Chat</h1>
      <button id="settingsBtn" title="API token settings">⚙</button>
    </header>

    <div id="settingsPanel" class="settings hidden">
      <label for="apiKey">Anthropic API token</label>
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      <label for="model">Model</label>
      <select id="model">
        <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
        <option value="claude-opus-4-8">claude-opus-4-8</option>
        <option value="claude-haiku-4-5-20251001">claude-haiku-4-5</option>
      </select>
      <p class="hint">Your token stays in this browser (localStorage) and is sent only to your own server, which forwards it to Anthropic for each request. It is never persisted server-side.</p>
      <button id="saveSettings">Save</button>
    </div>

    <main id="messages" class="messages"></main>

    <form id="chatForm" class="composer">
      <textarea id="input" placeholder="Type a message..." rows="1" required></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
