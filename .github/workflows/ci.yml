name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start server and smoke test
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          if [ "$STATUS" != "200" ]; then
            echo "Server did not respond with 200, got $STATUS"
            kill $SERVER_PID
            exit 1
          fi
          BODY=$(curl -s -X POST http://localhost:3000/api/chat -H "content-type: application/json" -d '{"messages":[{"role":"user","content":"hi"}]}')
          echo "$BODY"
          echo "$BODY" | grep -q "Missing API token" || (echo "Unexpected response" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID
