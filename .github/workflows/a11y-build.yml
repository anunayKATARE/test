name: A11y Inspector Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug || true

      - name: Diagnose AAR resources
        run: |
          echo "=== resolved AAR files ==="
          find ~/.gradle/caches/modules-2 -iname "*.aar" \( -ipath "*cardview*" -o -ipath "*constraintlayout*" -o -ipath "*material*" \) | sort
          echo "=== AAR contents ==="
          for f in $(find ~/.gradle/caches/modules-2 -iname "*.aar" \( -ipath "*cardview*1.0.0*" -o -ipath "*constraintlayout-2.1.4*" -o -ipath "*material-1.12.0*" \) | sort); do
            echo "-- $f --"
            unzip -l "$f" | grep -iE "res/|classes.jar|AndroidManifest" | head -15
          done
          echo "=== merged resources for activity_main ==="
          find /home/runner/work/test/test/app/build/intermediates -iname "activity_main.xml" | sort
          echo "=== compiled flat resources referencing menu/cardElevation ==="
          find /home/runner/work/test/test/app/build/intermediates -iname "*.flat" 2>/dev/null | xargs -I{} basename {} | grep -iE "cardview|constraint|menu" | sort -u

      - name: Fail if assembleDebug failed
        run: ./gradlew :app:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: domain/build/reports/tests/test
          if-no-files-found: ignore
