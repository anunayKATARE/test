name: A11y Inspector Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      - name: Diagnose AAR resources
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > /tmp/deps.txt || true
          echo "=== dependency tree matches ==="
          grep -A2 -iE "cardview|constraintlayout|com\.google\.android\.material" /tmp/deps.txt || true
          echo "=== resolved AAR files ==="
          find ~/.gradle/caches/modules-2 -iname "*.aar" \( -ipath "*cardview*" -o -ipath "*constraintlayout*" -o -ipath "*material*" \) | sort
          echo "=== AAR contents ==="
          for f in $(find ~/.gradle/caches/modules-2 -iname "*.aar" \( -ipath "*cardview*1.0.0*" -o -ipath "*constraintlayout-2.1.4*" -o -ipath "*material-1.12.0*" \) | sort); do
            echo "-- $f --"
            unzip -l "$f" | grep -iE "res/|classes.jar" | head -10
          done

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: domain/build/reports/tests/test
          if-no-files-found: ignore
