name: A11y Inspector Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug || true

      - name: Extract attr declarations directly from AARs
        run: |
          cardview_aar=$(find ~/.gradle/caches/modules-2 -iname "cardview-1.0.0.aar" | head -1)
          constraintlayout_aar=$(find ~/.gradle/caches/modules-2 -iname "constraintlayout-2.1.4.aar" | head -1)
          material_aar=$(find ~/.gradle/caches/modules-2 -iname "material-1.12.0.aar" | head -1)
          mkdir -p /tmp/aar-extract
          for entry in "cardview $cardview_aar cardElevation cardCornerRadius" \
                       "constraintlayout $constraintlayout_aar layout_constraintTop_toTopOf layout_constraintBottom_toTopOf layout_constraintBottom_toBottomOf" \
                       "material $material_aar menu"; do
            set -- $entry
            name=$1; aar=$2; shift 2
            echo "=== $name : $aar ==="
            if [ -z "$aar" ]; then echo "AAR NOT FOUND"; continue; fi
            unzip -p "$aar" res/values/values.xml > "/tmp/aar-extract/$name-values.xml" 2>/dev/null
            if [ ! -s "/tmp/aar-extract/$name-values.xml" ]; then echo "no res/values/values.xml extracted"; continue; fi
            wc -l "/tmp/aar-extract/$name-values.xml"
            for attr in "$@"; do
              echo "-- searching for attr: $attr --"
              grep -o "<attr name=\"$attr\"[^>]*>" "/tmp/aar-extract/$name-values.xml" || echo "NOT FOUND: $attr"
            done
          done

      - name: Run processDebugResources with --info logging (full clean rebuild)
        run: |
          ./gradlew :app:clean
          ./gradlew :app:processDebugResources --info > /tmp/processDebugResources.log 2>&1 || true

      - name: Show resolved dependency versions
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath > /tmp/deps.log 2>&1 || true
          echo "=== cardview/constraintlayout/material entries in debugCompileClasspath ==="
          grep -iE "cardview|constraintlayout|com.google.android.material" /tmp/deps.log || echo "NONE FOUND"

      - name: Show full AAPT2 link command and merge resources info
        run: |
          echo "=== total line count ==="
          wc -l /tmp/processDebugResources.log
          echo "=== ALL -R entries in entire log (full static-library input list) ==="
          grep -n "^-R " /tmp/processDebugResources.log || echo "NO -R LINES FOUND AT ALL"
          echo "=== ALL lines mentioning cardview/constraintlayout/material anywhere in log, with context ==="
          grep -n -iE "cardview|constraintlayout|material-1\.12|material/1\.12" /tmp/processDebugResources.log || echo "NONE FOUND IN FULL LOG"
          echo "=== merge-resources related lines (skipped/ignored/duplicate/conflict) ==="
          grep -n -iE "skip|ignor|duplicat|conflict|exclude" /tmp/processDebugResources.log | head -60
          echo "=== lines mentioning 'Merging' or 'MergeResources' or resource set ==="
          grep -n -iE "merging|mergeresources|resource set|ResourceSet" /tmp/processDebugResources.log | head -60

      - name: Fail if assembleDebug failed
        run: ./gradlew :app:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: domain/build/reports/tests/test
          if-no-files-found: ignore
