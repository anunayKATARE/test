name: A11y Inspector Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug || true

      - name: Extract attr declarations directly from AARs
        run: |
          cardview_aar=$(find ~/.gradle/caches/modules-2 -iname "cardview-1.0.0.aar" | head -1)
          constraintlayout_aar=$(find ~/.gradle/caches/modules-2 -iname "constraintlayout-2.1.4.aar" | head -1)
          material_aar=$(find ~/.gradle/caches/modules-2 -iname "material-1.12.0.aar" | head -1)
          mkdir -p /tmp/aar-extract
          for entry in "cardview $cardview_aar cardElevation cardCornerRadius" \
                       "constraintlayout $constraintlayout_aar layout_constraintTop_toTopOf layout_constraintBottom_toTopOf layout_constraintBottom_toBottomOf" \
                       "material $material_aar menu"; do
            set -- $entry
            name=$1; aar=$2; shift 2
            echo "=== $name : $aar ==="
            if [ -z "$aar" ]; then echo "AAR NOT FOUND"; continue; fi
            unzip -p "$aar" res/values/values.xml > "/tmp/aar-extract/$name-values.xml" 2>/dev/null
            if [ ! -s "/tmp/aar-extract/$name-values.xml" ]; then echo "no res/values/values.xml extracted"; continue; fi
            wc -l "/tmp/aar-extract/$name-values.xml"
            for attr in "$@"; do
              echo "-- searching for attr: $attr --"
              grep -o "<attr name=\"$attr\"[^>]*>" "/tmp/aar-extract/$name-values.xml" || echo "NOT FOUND: $attr"
            done
          done

      - name: Run processDebugResources with --info logging
        run: ./gradlew :app:processDebugResources --info --rerun > /tmp/processDebugResources.log 2>&1 || true

      - name: Show full AAPT2 link command
        run: |
          lineno=$(grep -n "command = .*aapt2 link" /tmp/processDebugResources.log | head -1 | cut -d: -f1)
          echo "=== aapt2 link command found at line $lineno ==="
          if [ -n "$lineno" ]; then
            sed -n "${lineno},$((lineno+400))p" /tmp/processDebugResources.log > /tmp/aapt2-link-cmd.txt
            echo "=== full -R / static-library inputs (cardview/constraintlayout/material) ==="
            grep -n -iE "cardview|constraintlayout|material-1.12|^-R |compiled" /tmp/aapt2-link-cmd.txt
            echo "=== total -R entries ==="
            grep -c "^-R " /tmp/aapt2-link-cmd.txt
            echo "=== last 30 lines of the command block (where it likely ends) ==="
            tail -30 /tmp/aapt2-link-cmd.txt
          fi

      - name: Fail if assembleDebug failed
        run: ./gradlew :app:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: domain/build/reports/tests/test
          if-no-files-found: ignore
